name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
      - run: go mod download
      - run: make verify test lint vuln
      - run: make -j2 build-all
      - run: make integration
