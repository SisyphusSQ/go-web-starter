name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go test -tags integration ./internal/scaf_fold -run TestGenerateE2EDBCombosIntegration -count=1
